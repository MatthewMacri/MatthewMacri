# Redraw the README's stat cards.
#
# The cards used to be fetched from the shared github-readme-stats instance
# on Vercel. That deployment is paused, so they rendered as broken images
# with nothing wrong on this side and no way to fix it from here. They are
# drawn here now and committed as SVG, which means the README depends on
# nothing but this repository.
name: Stats cards

on:
  schedule:
    - cron: "17 6 * * *"   # daily, a few minutes off the hour
  workflow_dispatch:        # and on demand, from the Actions tab
  push:
    paths:
      - tools/make_stats_cards.py
      - .github/workflows/stats-cards.yml

permissions:
  contents: write

concurrency:
  group: stats-cards
  cancel-in-progress: true

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # a rebase needs history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw the cards
        env:
          # The built-in GITHUB_TOKEN cannot use the Search API across
          # repositories, so with it alone the commit, PR and issue counts
          # come back 422 and the script reuses the last figures it read.
          # Add a classic PAT with public_repo and read:user as the secret
          # STATS_TOKEN to keep those three live.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/make_stats_cards.py

      - name: Commit, only if something actually changed
        run: |
          if git diff --quiet -- assets; then
            echo "cards unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg assets/stats.json
          git commit -m "chore: redraw stats cards"

          # Something may have landed on main since the checkout. These
          # files are generated, so on a clash the freshly drawn one wins
          # -- during a rebase that is "theirs", the commit being applied.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto main (attempt $attempt)"
            git pull --rebase --strategy-option=theirs origin main
          done
          echo "could not push after three attempts" >&2
          exit 1
