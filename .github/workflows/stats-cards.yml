# Redraw the README's stat cards.
#
# The cards used to be fetched from the shared github-readme-stats instance
# on Vercel. That deployment is paused, so they rendered as broken images
# with nothing wrong on this side and no way to fix it from here. They are
# drawn here now and committed as SVG, which means the README depends on
# nothing but this repository.
name: Stats cards

on:
  schedule:
    - cron: "17 6 * * *"   # daily, a few minutes off the hour
  workflow_dispatch:        # and on demand, from the Actions tab
  push:
    paths:
      - tools/make_stats_cards.py
      - .github/workflows/stats-cards.yml

permissions:
  contents: write

concurrency:
  group: stats-cards
  cancel-in-progress: true

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw the cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/make_stats_cards.py

      - name: Commit, only if something actually changed
        run: |
          if git diff --quiet -- assets; then
            echo "cards unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg
          git commit -m "chore: redraw stats cards"
          git push
